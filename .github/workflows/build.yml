name: Build NEXUS debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Download official fonts (Vazirmatn, Inter) into the app assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/fetch_fonts.sh
      - name: Upload fonts (commit these into the repo if you want them versioned)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-fonts
          path: app/src/main/assets/fonts/
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Unit tests
        if: always()
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
